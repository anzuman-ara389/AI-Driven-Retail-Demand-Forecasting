name: MLOps Pipeline Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Check Python syntax
        run: |
          python -m compileall src

      - name: Validate core project modules
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python - <<'PY'
          from src.database import init_db
          from src.live_ingestion import generate_food_sales_record
          from src.drift_detection import calculate_drift_score

          init_db()

          record = generate_food_sales_record()
          print("Generated retail event:", record)

          score = calculate_drift_score(100, 120)
          print("Drift score:", score)

          print("Core project module validation passed.")
          PY

      - name: Validate FastAPI health endpoint
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from src.main import app

          client = TestClient(app)
          response = client.get("/health")

          assert response.status_code == 200
          assert response.json()["status"] == "healthy"

          print("FastAPI health endpoint validation passed.")
          PY

      - name: Run automated tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest tests/ -v