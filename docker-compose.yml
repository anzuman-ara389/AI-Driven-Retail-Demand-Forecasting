services:

  api:
    build: .
    container_name: retail-demand-api
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./artifacts:/app/artifacts
      - ./logs:/app/logs
    restart: unless-stopped

  dashboard:
    build: .
    container_name: retail-demand-dashboard
    command: streamlit run src/frontend.py --server.address 0.0.0.0 --server.port 8501
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./artifacts:/app/artifacts
      - ./logs:/app/logs
    depends_on:
      - api
    restart: unless-stopped